version: '3.8'

services:
  roadshowai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - roadshow-data:/app/server/data
    environment:
      - NODE_ENV=production
      - PORT=5000

volumes:
  roadshow-data:
    # This named volume will persist the data.json file
